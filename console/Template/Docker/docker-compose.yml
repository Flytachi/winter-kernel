services:
  server:
    tty: true
    container_name: ${COMPOSE_PROJECT_NAME:-app}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEV: ${DEV:-false}
    stop_grace_period: 40s
    # Healthy while every critical component runs: `call application health` exits 0, else 1 —
    # what `depends_on: condition: service_healthy` waits for. Docker does not restart an
    # unhealthy container; a liveness probe that does (k8s) asks `call application alive`.
    healthcheck:
      test: ["CMD", "php", "call", "application", "health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 5s
      retries: 3
    ports:
      - "8000:8000"
    volumes:
      - ./:/app/
