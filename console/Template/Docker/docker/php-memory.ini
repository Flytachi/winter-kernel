; --------------------------
; Memory
; --------------------------
;
; This file is always active — dev and prod alike — unlike php-opcache.ini, which the
; entrypoint switches on only outside dev mode.

; Memory ceiling for ONE worker process.
;
; PHP's own default is 128M, and it is invisible: nothing announces it, so the first
; time most projects learn the number is when a worker dies under load. 256M is set
; here explicitly so the dial is where you can see it.
;
; Two things about this limit are easy to get wrong:
;
;   1. It is per PROCESS, and a Swoole worker serves many requests at once as
;      coroutines out of one heap. So it bounds their SUM, not any single request.
;      Measured on a small API: roughly 90 KB of heap per in-flight request, i.e.
;      ~1400 concurrent requests fit in 128M and ~2800 in 256M.
;
;   2. The box must hold worker_num × this value, plus opcache's shared memory
;      (see php-opcache.ini). Four workers at 256M want 1 GiB before a single row of
;      data is read. The framework warns at startup when that product exceeds the
;      container's memory limit.
;
; Raising it moves the threshold; it does not remove it. What keeps a worker alive
; under a spike is bounding concurrency, not the ceiling.
;
; Do NOT set -1 here. Unlimited does not remove the ceiling, it moves it into the
; kernel: PHP never stops the process, so the OOM killer eventually sends SIGKILL —
; no shutdown functions, no log line, and the whole container when the server is PID 1.
; A real limit at least fails through PHP, and the manager restarts that one worker.
memory_limit = 256M
