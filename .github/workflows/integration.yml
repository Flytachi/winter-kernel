name: Integration

on:
  push:
    branches: [main, k2]
  pull_request:

jobs:
  integration:
    name: Ppa Integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      pg-test:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: winter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: winter_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptest"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

      mariadb-test:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: winter_test
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

    env:
      PG_TEST_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=winter_test"
      PG_TEST_USER: postgres
      PG_TEST_PASS: test

      MYSQL_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=winter_test"
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASS: test

      MARIADB_TEST_DSN: "mysql:host=127.0.0.1;port=3307;dbname=winter_test"
      MARIADB_TEST_USER: root
      MARIADB_TEST_PASS: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, pdo_mysql, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run unit suites (sanity)
        run: vendor/bin/phpunit

      - name: Run integration suite (smoke + migration via rawPdo)
        run: vendor/bin/phpunit --group integration

      - name: Run CDO/Pool connection tests (diagnostic; non-blocking)
        continue-on-error: true
        run: vendor/bin/phpunit --group pool
