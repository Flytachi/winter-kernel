name: Integration

on:
  push:
    branches: [main, k2]
  pull_request:

jobs:
  integration:
    name: Ppa Integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      pg-test:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: winter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: winter_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptest"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

      mariadb-test:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: winter_test
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

    env:
      PG_TEST_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=winter_test"
      PG_TEST_USER: postgres
      PG_TEST_PASS: test

      MYSQL_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=winter_test"
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASS: test

      MARIADB_TEST_DSN: "mysql:host=127.0.0.1;port=3307;dbname=winter_test"
      MARIADB_TEST_USER: root
      MARIADB_TEST_PASS: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # swoole is not optional here even though the framework treats it as such:
          # without it roughly sixty tests — the coroutine adapters, the request-local
          # store, the watchdog, the pool channel and its telemetry timer — skip instead
          # of running, and a skip reads as a pass. Those are precisely the paths that
          # only exist under the resident runtime, so a CI without swoole leaves the
          # runtime the framework is built for untested.
          # decimal and bcmath are the same story on a smaller scale: without them the
          # exact-number binding cases skip, and money is exactly where a silent skip is
          # worst. bcmath is guarded in twenty-four tests — the most of any optional
          # extension here — so naming it explicitly is cheaper than trusting a default.
          extensions: pdo, pdo_pgsql, pdo_mysql, mbstring, swoole, decimal, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      # A missing extension does not fail the run — it turns those tests into skips,
      # which the summary reports as green. Fail here instead, where the reason is
      # one line rather than sixty silent omissions.
      - name: Verify the optional extensions are present
        run: |
          for ext in swoole decimal bcmath; do
            php -r "exit(extension_loaded(\"$ext\") ? 0 : 1);" \
              || { echo "::error::ext-$ext did not install — its suites would silently skip"; exit 1; }
            php -r "printf(\"%s %s\n\", \"$ext\", phpversion(\"$ext\"));"
          done

      - name: Run unit suites (sanity)
        run: vendor/bin/phpunit

      - name: Run integration suite (smoke + migration + CRUD)
        run: vendor/bin/phpunit --group integration

      - name: CDO process-isolated diagnostic
        run: vendor/bin/phpunit --group cdo-diagnostic

      - name: CDO/Pool connection tests
        run: vendor/bin/phpunit --group pool
